name: Deploy Reloop Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: reloop-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Read preview source
        uses: actions/checkout@v4
      - name: Prepare safe static preview
        run: |
          mkdir -p _site/templates
          cp index.html preview.js styles.css _site/
          cp templates/*.xlsx _site/templates/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
